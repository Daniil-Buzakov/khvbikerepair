name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Create necessary directories
        run: |
          mkdir -p static/main/css
          mkdir -p static/main/js
          mkdir -p media
          touch static/main/css/style.css
          touch static/main/js/main.js
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Django==4.2.7
          pip install django-distill==1.9.0
      
      - name: Create database and collect static
        run: |
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput --clear
        env:
          SECRET_KEY: 'django-insecure-build-key-temp'
          DEBUG: 'False'
      
      - name: Distill site
        run: |
          echo "yes" | python manage.py distill-local --force public
        env:
          SECRET_KEY: 'django-insecure-build-key-temp'
          DEBUG: 'False'
          DJANGO_DISTILL_FORCE: 'yes'
      
      - name: Add .nojekyll
        run: touch public/.nojekyll
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4